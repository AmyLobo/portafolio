<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amy Lobo — Portafolio</title>
  <meta name="description" content="Portafolio interactivo de Amy Lobo con diseño editorial sereno y transiciones fluidas." />
  <meta property="og:title" content="Amy Lobo — Portafolio" />
  <meta property="og:description" content="Portafolio interactivo de Amy Lobo con diseño editorial sereno y transiciones fluidas." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">
    <div id="portfolio-viewport">

      <!-- Contenido principal -->
      <div id="content-root">

        <!-- ============ VISTA: HOME ============ -->
        <div id="home-view">
          <div class="home-grid">
            <!-- Columna izquierda -->
            <div class="nav-column nav-column-1">
              <div class="nav-column-header">
                <span class="nav-column-title"><span class="dot-gold"></span>Perfil y trayectoria</span>
              </div>
              <div class="nav-cards" id="nav-cards-left"></div>
            </div>

            <!-- Columna central -->
            <div class="nav-column nav-column-2">
              <div class="home-center">
                <div>
                  <h1 class="home-center-name" id="home-center-name"></h1>
                  <div class="home-center-motif">
                    <svg width="32" height="16" viewBox="0 0 32 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <polygon points="0,0 32,0 16,16" fill="currentColor" />
                    </svg>
                  </div>
                </div>
                <p class="home-center-title" id="home-center-title"></p>
                <span class="home-center-location" id="home-center-location"></span>
              </div>
            </div>

            <!-- Columna derecha -->
            <div class="nav-column nav-column-3">
              <div class="nav-column-header align-right">
                <span class="nav-column-title"><span class="dot-gold"></span>Trabajo y contacto</span>
              </div>
              <div class="nav-cards" id="nav-cards-right"></div>
            </div>
          </div>
        </div>

        <!-- ============ VISTA: SECCIÓN ============ -->
        <div id="section-view" class="hidden">
          <div class="section-card">
            <!-- Header -->
            <div class="section-header">
              <div class="section-header-left">
                <button id="back-to-home-btn" class="btn-back">
                  <i data-lucide="arrow-left" class="icon"></i>
                  <span class="hide-mobile">Volver al Inicio</span>
                  <span class="show-mobile">Volver</span>
                </button>
                <div class="breadcrumb">
                  <span class="breadcrumb-name hide-mobile" id="crumb-name"></span>
                  <i data-lucide="chevron-right" class="icon hide-mobile"></i>
                  <span class="breadcrumb-group" id="crumb-group"></span>
                  <i data-lucide="chevron-right" class="icon"></i>
                  <span class="breadcrumb-current" id="crumb-current"></span>
                </div>
              </div>
              <button id="close-section-modal-btn" class="btn-close-x" title="Cerrar (Esc)">
                <i data-lucide="x" class="icon"></i>
              </button>
            </div>

            <!-- Tabs -->
            <div class="section-tabs">
              <div id="section-tabs-list"></div>
            </div>

            <!-- Contenido -->
            <div class="section-content" id="section-content"></div>
          </div>
        </div>

      </div>
    </div>

    <!-- ============ MODAL: Detalle de proyecto ============ -->
    <div id="project-modal-overlay" class="modal-overlay hidden">
      <div class="modal-box wide" id="project-modal-box"></div>
    </div>

  </div>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="/data.js"></script>
  <script src="/app.js"></script>
</body>
</html>
